name: Verify current data archive
on:
  pull_request:
    paths:
      - 'tools/release_candidate.py'
      - 'tools/merged_query.py'
      - 'tests/test_merged_query.py'
      - 'docs/MERGED_QUERY.md'
      - 'tests/test_release_candidate.py'
      - 'docs/RELEASE_CANDIDATE.md'
      - 'docs/reports/pc-1.111.0.177-release-qa.json'
      - 'docs/reports/pc-1.111.0.177-release-qa.md'
      - '.github/workflows/release-candidate.yml'
      - 'docs/snapshots/pc-1.111.0.177-229314.json'
      - 'docs/SOURCE_REGISTER.json'
      - 'data/current.zip'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run synthetic release candidate tests (no game data)
        run: python -m unittest discover -s tests -p 'test_release_candidate.py' -v
      - name: Regenerate lineage metadata using July history
        run: >-
          python tools/schema_lineage.py
          --manifest docs/snapshots/pc-1.111.0.177-229314.json
          --history-root .
          --output build/schema_lineage_229314.json
          --summary build/schema_lineage_summary_229314.json
      - name: Validate historical QA metadata
        run: >-
          python tools/release_candidate.py
          --manifest docs/snapshots/pc-1.111.0.177-229314.json
          --lineage build/schema_lineage_229314.json
          --report docs/reports/pc-1.111.0.177-release-qa.json
          --check-published-report
      - name: Verify current archive tables
        run: >-
          python tools/query.py
          tables --filter SEASON
      - name: Re-audit complete published ZIP against snapshot and Schema lineage
        run: >-
          python tools/release_candidate.py
          --source data/current.zip
          --manifest docs/snapshots/pc-1.111.0.177-229314.json
          --lineage build/schema_lineage_229314.json
          --report build/current_verified_qa.json
